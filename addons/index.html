
<!DOCTYPE html>
<html lang="en">
<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #1f1c2c, #928dab);
        color: #fff;
        padding-bottom: 2rem;
    }

    body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(to bottom, 135deg, #1f1c2c, #928dab); /* gradient yg kamu pakai */
    }

    .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.5);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    backdrop-filter: blur(10px);
    z-index: 100;
    color: white;
    position: relative;
    }
    
    .navbar .brand {
    font-weight: 600;
    font-size: 1.2rem;
    }
    
    /* Hamburger */
    .menu-toggle {
    display: none;
    font-size: 1.8rem;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    z-index: 1001;
    }
    
    /* Menu */
    .menu {
    display: flex;
    gap: 2rem;
    align-items: center;
    }
    
    .menu a {
    color: white;
    text-decoration: none;
    padding: 0.5rem 0;
    font-weight: 500;
    transition: color 0.3s ease;
    }
    
    .menu a:hover {
    color: #ffcc70;
    }
    
    /* Responsive Overlay Menu */
    @media (max-width: 768px) {
    .menu-toggle {
    display: block;
    position: absolute;
    right: 1.5rem;
    top: 1.2rem;
    }
    
    .menu {
    flex-direction: column;
    position: fixed;
    top: 60px;
    right: 0;
    background-color: rgba(0, 0, 0, 0.9);
    width: 200px;
    padding: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
    border-bottom-left-radius: 1rem;
    }
    
    .menu.active {
    opacity: 1;
    pointer-events: auto;
    }
    }

    h2 {
        text-align: center;
        margin-top: 2rem;
        color: #ffe;
    }

    .skin-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 1rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .skin-item {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .skin-item:hover {
            transform: translateY(-5px);
        }

        .skin-item img {
            width: 100%;
            border-radius: 0.5rem;
            object-fit: cover;
        }

        .skin-item a {
            color: #ffcc70;
            text-decoration: none;
            display: block;
            margin-top: 0.5rem;
            font-weight: 500;
        }

    p {
        text-align: center;
        margin-top: 2rem;
    }

    a {
        color: #ffcc70;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    a:hover {
        color: #ffdcae;
    }

    hr {
        width: 80%;
        border: none;
        border-top: 2px solid rgba(255,255,255,0.2);
        margin: 2rem auto;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erbejee Trainz</title>
    <link rel="stylesheet" href="/trainz/style.css" />
    <link rel="shortcut icon" href="/trainz/favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
<div id="loader">
    <div class="spinner"></div>
</div>

    <nav class="navbar">
        <div class="brand">Erbejee Trainz</div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="menu" id="navMenu">
  <a href="/trainz/">Home</a>

  <div class="has-submenu">
    <a href="#">Skin</a>
    <div class="submenu">
      <a href="/trainz/loko/">Loko</a>
      <a href="/trainz/consist">Consist</a>
    </div>
  </div>

  <a href="/trainz/addons/">Addons</a>       
  <a href="/trainz/route/">Route</a>
  <a href="/trainz/sosmed/">Sosmed</a>
  <a href="/trainz/tutor/">Tutorial</a>
</div>
    </nav>

    <hr />
    <h2>Addons</h2>
    <div class="skin-gallery">
        <div class="skin-item">
            <img src="/trainz/joglosemarkerto.jpg" alt="Trainset Joglosemarkerto">
            <a href="https://sfl.gl/aNJVG">Trainset Joglosemarkerto</a>
        </div>
        
        <div class="skin-item">
            <img src="/trainz/bkuning.png" alt="B 0 58 03 YK">
            <a href="https://sfl.gl/udVwvB">B 0 58 03 YK</a>
        </div>    

        <div class="skin-item">
            <img src="/trainz/retroo.jpeg" alt="K1 0 82 24 JAKK(Retro)">
            <a href="https://sfl.gl/jHwvN">K1 0 82 24 JAKK(Retro)</a>
        </div>

         <div class="skin-item">
            <img src="/trainz/8001.jpeg" alt="P 0 80 01 CN">
            <a href="https://sfl.gl/m3GW1">P 0 80 01 CN</a>
        </div>    

        <div class="skin-item">
            <img src="/trainz/9802.jpeg" alt="M1 0 98 02 BL">
            <a href="https://sfl.gl/HFf1PpVw">M1 0 98 02 BL</a>
        </div>
    </div>
    <hr />
    <footer>
    <p class="copyright">Copyright © 2025 Erbejee.</p>
</footer>
<script>
    function toggleMenu() {
        const menu = document.getElementById('navMenu');
        menu.classList.toggle('active');
    }
    window.addEventListener('load', () => {
    document.body.classList.add('loaded');
    });
    
    // Fade-out saat link diklik
    document.querySelectorAll('a[href]').forEach(link => {
    if (link.getAttribute('href').startsWith('#')) return;
    link.addEventListener('click', function(e) {
    e.preventDefault();
    const href = this.getAttribute('href');
    document.body.classList.remove('loaded');
    setTimeout(() => {
    window.location.href = href;
    }, 300);
    });
    });
    
   
    window.addEventListener('load', () => {
    const loader = document.getElementById('loader');
    document.body.classList.add('loaded');
    loader.style.opacity = 0;
    setTimeout(() => loader.style.display = 'none', 300);
    });
    
    document.querySelectorAll('a[href]').forEach(link => {
    if (link.getAttribute('href').startsWith('#')) return;
    link.addEventListener('click', function(e) {
    e.preventDefault();
    const href = this.getAttribute('href');
    document.body.classList.remove('loaded');
    setTimeout(() => {
    window.location.href = href;
    }, 300);
    });
    });

    document.querySelectorAll('.has-submenu > a').forEach(item => {
  item.addEventListener('click', function (e) {
    const parent = this.parentElement;
    if (window.innerWidth <= 768) {
      e.preventDefault();

      // Tutup semua submenu lain
      document.querySelectorAll('.has-submenu').forEach(el => {
        if (el !== parent) el.classList.remove('active');
      });

      // Toggle submenu saat ini
      parent.classList.toggle('active');
    }
  });
});
    </script>
</body>
</html>
