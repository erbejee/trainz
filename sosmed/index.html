<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            padding-bottom: 2rem;
        }

        body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(to bottom, 135deg, #1f1c2c, #928dab); /* gradient yg kamu pakai */
    }

        .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.5);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    backdrop-filter: blur(10px);
    z-index: 100;
    color: white;
    position: relative;
    }
    
    .navbar .brand {
    font-weight: 600;
    font-size: 1.2rem;
    }
    
    /* Hamburger */
    .menu-toggle {
    display: none;
    font-size: 1.8rem;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    z-index: 1001;
    }
    
    /* Menu */
    .menu {
    display: flex;
    gap: 2rem;
    align-items: center;
    }
    
    .menu a {
    color: white;
    text-decoration: none;
    padding: 0.5rem 0;
    font-weight: 500;
    transition: color 0.3s ease;
    }
    
    .menu a:hover {
    color: #ffcc70;
    }
    
    /* Responsive Overlay Menu */
    @media (max-width: 768px) {
    .menu-toggle {
    display: block;
    position: absolute;
    right: 1.5rem;
    top: 1.2rem;
    }
    
    .menu {
    flex-direction: column;
    position: fixed;
    top: 60px;
    right: 0;
    background-color: rgba(0, 0, 0, 0.9);
    width: 200px;
    padding: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
    border-bottom-left-radius: 1rem;
    }
    
    .menu.active {
    opacity: 1;
    pointer-events: auto;
    }
    }

        h2 {
            text-align: center;
            margin-top: 2rem;
            color: #ffe;
        }

        .sosmed-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .sosmed-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .sosmed-card:hover {
            transform: translateY(-5px);
        }

        .sosmed-card img {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
        }

        .sosmed-card a {
            color: #ffcc70;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            display: block;
            margin-top: 0.5rem;
        }

        .sosmed-card a:hover {
            color: #ffdcae;
        }

        hr {
            width: 80%;
            border: none;
            border-top: 2px solid rgba(255,255,255,0.2);
            margin: 2rem auto;
        }
    </style>
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erbejee Trainz</title>
    <link rel="stylesheet" href="/trainz/style.css" />
    <link rel="shortcut icon" href="/trainz/favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
<div id="loader">
    <div class="spinner"></div>
</div>

    <nav class="navbar">
        <div class="brand">Erbejee Trainz</div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="menu" id="navMenu">
  <a href="/trainz/">Home</a>

  <div class="has-submenu">
    <a href="#">Skin</a>
    <div class="submenu">
      <a href="/trainz/loko/">Loko</a>
      <a href="/trainz/consist">Consist</a>
    </div>
  </div>

  <a href="/trainz/route/">Route</a>
  <a href="/trainz/sosmed/">Sosmed</a>
</div>
    </nav>

    <hr />

    <h2>Ikuti saya</h2>

    <div class="sosmed-container">
        <div class="sosmed-card">
            <img src="/trainz/img/ytb.png" alt="YouTube" />
            <div>YouTube</div>
            <a href="https://youtube.com/@erbejeee" target="_blank">Erbejee</a>
        </div>
        <div class="sosmed-card">
            <img src="/trainz/img/tt.png" alt="TikTok" />
            <div>TikTok</div>
            <a href="https://tiktok.com/@erbejeee" target="_blank">@erbejeee</a>">@erbejee</a>
        </div>
        <div class="sosmed-card">
            <img src="/trainz/img/ig.jpg" alt="Instagram" />
            <div>Instagram</div>
            <a href="https://instagram.com/erbejeee" target="_blank">@erbejeee</a>
        </div>
    </div>
 <hr />
    <footer>
    <p class="copyright">Copyright © 2025 Erbejee.</p>
</footer>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('active');
        }
        window.addEventListener('load', () => {
        document.body.classList.add('loaded');
        });
        
        // Fade-out saat link diklik
        document.querySelectorAll('a[href]').forEach(link => {
        if (link.getAttribute('href').startsWith('#')) return;
        link.addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        document.body.classList.remove('loaded');
        setTimeout(() => {
        window.location.href = href;
        }, 300);
        });
        });
        
        window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        document.body.classList.add('loaded');
        loader.style.opacity = 0;
        setTimeout(() => loader.style.display = 'none', 300);
        });
        
        document.querySelectorAll('a[href]').forEach(link => {
        if (link.getAttribute('href').startsWith('#')) return;
        link.addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        document.body.classList.remove('loaded');
        setTimeout(() => {
        window.location.href = href;
        }, 300);
        });
        });
    </script>
</body>
</html>
